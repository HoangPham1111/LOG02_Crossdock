spring.application.name=crossdock
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5412/crossdock}
spring.datasource.username=${DB_USER:crossdock}
spring.datasource.password=${DB_PASSWORD:phamhuyhoang}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=30m
server.error.include-message=never
spring.jackson.time-zone=Asia/Ho_Chi_Minh
app.seed=${APP_SEED:true}
app.settings-file=${SETTINGS_FILE:./data/settings.properties}
