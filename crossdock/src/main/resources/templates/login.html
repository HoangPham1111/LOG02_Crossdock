<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho CrossDock trung chuyển linh kiện xe oto</title><link rel="stylesheet" href="/css/app.css"></head><body class="login-body"><div class="login-art"><div class="brand login-brand"><img class="brand-logo" src="/images/logo.jpeg" alt="Logo CrossDock"><span>Kho CrossDock<br><small>trung chuyển linh kiện xe oto</small></span></div><h1>Kho CrossDock<br>trung chuyển linh kiện xe oto</h1></div><main class="login-panel"><div class="login-box"><span class="eyebrow">CHÀO MỪNG TRỞ LẠI</span><h2>Đăng nhập hệ thống</h2><p class="muted">Sử dụng tài khoản được quản trị viên cấp.</p><p class="alert error" th:if="${param.error}">Tài khoản hoặc mật khẩu không đúng.</p><p class="alert" th:if="${param.logout}">Bạn đã đăng xuất.</p><form th:action="@{/login}" method="post"><label>Tài khoản<input name="username" autocomplete="username" placeholder="Nhập tên tài khoản" required autofocus></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required></label><button class="primary full" type="submit">Đăng nhập</button></form><p class="footnote">Tài khoản chỉ thao tác trong phạm vi vai trò được cấp.</p></div></main></body></html>
