services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: crossdock
      POSTGRES_USER: crossdock
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crossdock_demo_2026}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/00_postgis.sql:/docker-entrypoint-initdb.d/00_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossdock -d crossdock"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports: ["8082:8082"]
    environment:
      PORT: 8082
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5412/crossdock}
      DB_USER: ${DB_USER:-crossdock}
      DB_PASSWORD: ${DB_PASSWORD:-crossdock_demo_2026}
      APP_SEED: "true"
      SETTINGS_FILE: /app/data/settings.properties
    volumes: ["appdata:/app/data"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  appdata:
